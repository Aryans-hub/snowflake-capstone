name: CI Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linting:
    name: Ruff Lint and Format
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.10"

      # - name: Install Ruff
      #   run: python -m pip install ruff==0.14.0

      - name: Check linting
        run: ruff check Airflow/dags

      - name: Check formatting
        run: ruff format --check Airflow/dags

  secret-scan:
    name: Secret Scan
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # - name: Install Gitleaks
      #   env:
      #     GITLEAKS_VERSION: "8.24.3"
      #   run: |
      #     curl -sSfL \
      #       "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
      #       -o gitleaks.tar.gz

      #     tar -xzf gitleaks.tar.gz gitleaks
      #     sudo install gitleaks /usr/local/bin/gitleaks
      #     rm -f gitleaks.tar.gz gitleaks

      - name: Scan repository files for secrets
        # run: gitleaks dir . --redact --verbose
        run: '& "C:\Tools\Gitleaks\gitleaks.exe" dir . --redact --verbose'

  repo-guard:
    name: Repository Guard
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check forbidden files
        # shell: bash
        # run: |
        #   if git ls-files | grep -E '(^|/)\.env($|\.)' \
        #     | grep -Ev '(^|/)\.env\.example$'; then
        #     echo "ERROR: Forbidden .env file detected!"
        #     exit 1
        #   fi

        #   echo "No forbidden .env files detected."
        run: |
          $trackedFiles = git ls-files

          $forbiddenFiles = $trackedFiles | Where-Object {
            $_ -match '(^|/)\.env($|\.)' -and
            $_ -notmatch '(^|/)\.env\.example$'
          }

          if ($forbiddenFiles) {
            Write-Error "Forbidden .env file detected:"
            $forbiddenFiles | ForEach-Object { Write-Host $_ }
            exit 1
          }

          Write-Host "No forbidden .env files detected."

      - name: Check large files
        run: |
          @'
          import os
          import subprocess
          import sys

          max_size = 100 * 1024 * 1024

          files = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode().split("\0")

          oversized = []

          for file in filter(None, files):
              if os.path.isfile(file) and os.path.getsize(file) > max_size:
                  oversized.append(file)

          if oversized:
              print("ERROR: Files larger than 100 MB detected:")
              for file in oversized:
                  print(f"  {file}")
              sys.exit(1)

          print("No tracked files larger than 100 MB detected.")
          '@ | Set-Content -Path "$env:TEMP\check_large_files.py" -Encoding utf8

          python "$env:TEMP\check_large_files.py"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Check required project structure
        run: |
          $requiredPaths = @(
            "Airflow/dags"
            "pyproject.toml"
            ".github/workflows/ci.yml"
          )

          foreach ($path in $requiredPaths) {
            if (-not (Test-Path $path)) {
              Write-Error "Required path missing: $path"
              exit 1
            }
          }

          Write-Host "Required project structure is present."

  convention-check:
    name: Convention Checks
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check branch name
        # shell: powershell
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if ($env:BRANCH_NAME -notmatch '^feature/[a-z0-9]+(-[a-z0-9]+)*$') {
            Write-Error "Invalid branch name: $env:BRANCH_NAME"
            exit 1
          }

          Write-Host "Branch name is valid."

      - name: Check latest commit message format
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $allowedTypes = "feat|fix|docs|test|refactor|ci|build|chore|perf"

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
          }

          $url = "https://api.github.com/repos/$env:REPOSITORY/commits/$env:PR_HEAD_SHA"

          $commit = Invoke-RestMethod -Uri $url -Headers $headers -Method Get

          $subject = ($commit.commit.message -split "`n")[0]

          if ($subject -notmatch "^($allowedTypes): .+") {
            Write-Error "Invalid commit message: $subject"
            Write-Host "Expected format: type: description"
            exit 1
          }

          Write-Host "Latest commit message follows the required format."
          