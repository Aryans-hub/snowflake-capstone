name: CI Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linting:
    name: Ruff Lint and Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: python -m pip install ruff==0.14.0

      - name: Check linting
        run: ruff check Airflow/dags

      - name: Check formatting
        run: ruff format --check Airflow/dags

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz

          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz gitleaks

      - name: Scan repository files for secrets
        run: gitleaks dir . --redact --verbose

  repo-guard:
    name: Repository Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check forbidden files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' \
            | grep -Ev '(^|/)\.env\.example$'; then
            echo "ERROR: Forbidden .env file detected!"
            exit 1
          fi

          echo "No forbidden .env files detected."

      - name: Check large files
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          max_size = 100 * 1024 * 1024
          files = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode().split("\0")

          oversized = []

          for file in filter(None, files):
              if os.path.isfile(file) and os.path.getsize(file) > max_size:
                  oversized.append(file)

          if oversized:
              print("ERROR: Files larger than 100 MB detected:")
              for file in oversized:
                  print(f"  {file}")
              sys.exit(1)

          print("No tracked files larger than 100 MB detected.")
          PY

      - name: Check required project structure
        run: |
          required_paths=(
            "Airflow/dags"
            "pyproject.toml"
            ".github/workflows/ci.yml"
          )

          for path in "${required_paths[@]}"; do
            if [ ! -e "$path" ]; then
              echo "ERROR: Required path missing: $path"
              exit 1
            fi
          done

          echo "Required project structure is present."

  convention-check:
    name: Branch Convention Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH_NAME" =~ ^feature/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "ERROR: Invalid branch name: $BRANCH_NAME"
            exit 1
          fi

          echo "Branch name is valid."
          