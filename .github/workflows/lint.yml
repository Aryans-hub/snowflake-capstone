name: Python Linting

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Ruff Lint and Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: python -m pip install ruff==0.14.0

      - name: Verify Ruff version
        run: ruff --version

      - name: Clear Ruff cache
        shell: bash
        run: |
          rm -rf ~/.cache/ruff
          rm -rf .ruff_cache

      - name: Check linting
        run: ruff check Airflow/dags

      - name: Check formatting
        run: ruff format --check Airflow/dags